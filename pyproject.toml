[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-media-zettelkasten"
version = "1.0.0"
description = "Local image and media zettelkasten ingestion, deduplication, and Tauri/Svelte UI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "gallery-dl>=1.30,<2",
    "huggingface_hub>=0.27,<2",
    "imagehash>=4.3,<5",
    "numpy>=2,<3",
    "onnxruntime>=1.17,<2",
    "pillow>=10,<13",
    "playwright>=1.50,<2",
    "pydantic>=2,<3",
    "psutil>=6,<8",
    "python-multipart>=0.0.9,<1",
    "pyyaml>=6,<7",
    "sentence-transformers>=5,<6",
    "torch>=2.5,<3",
    "tqdm>=4.66,<5",
    "watchdog>=4,<7",
    "yt-dlp>=2025,<2027",
]

[project.optional-dependencies]
windows = [
    "python-magic-bin>=0.4,<1",
]
unix = [
    "python-magic>=0.4,<1",
]
gpu = [
    "onnxruntime-gpu>=1.17,<2",
]
tauri = [
    "pyinstaller>=6,<7",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
lmz = "core:main"
lmz-adopt-content = "content_adoption:main"

[tool.setuptools]
package-dir = {"" = "backend"}
py-modules = [
    "core",
    "external_ingestion",
    "fingerprint",
    "md_generator",
    "metadata_index",
    "processor",
    "utils",
    "validators",
    "app_paths",
    "config_repository",
    "config_schema",
    "content_adoption",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["db", "downloaders", "logger", "scripts", "tagging"]
exclude = ["backups", "program", "tools", "tests", "data", "secrets"]

[tool.ruff]
line-length = 100
target-version = "py313"
